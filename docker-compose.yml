version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: himkavach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: himkavach
      POSTGRES_PASSWORD: himkavach_dev_password
      POSTGRES_DB: himkavach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himkavach -d himkavach"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: himkavach-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://himkavach:himkavach_dev_password@postgres:5432/himkavach
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
